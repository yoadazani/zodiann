name: ephemeris_swiss
description: "EphemerisPort implementation over Swiss Ephemeris (FFI)."
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  # ZOD-FND-003: the Android build hook (hook/build.dart) compiles the vendored
  # Swiss Ephemeris source with native assets; ffi marshals the calls.
  code_assets: ^2.0.0
  ffi: ^2.1.4
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.4

dev_dependencies:
  # ZOD-FND-003: generates lib/src/ffi/swisseph_bindings.g.dart
  # (`dart run ffigen --config ffigen.yaml`; needs libclang).
  ffigen: ^23.0.0
  test: ^1.32.0

# ZOD-FND-003 (decision D2): the data files are bundled as package assets,
# because Flutter bundles only assets declared inside a package.
# ZOD-FND-011 (owner decision 2026-11-25): ship only the sepl_18 + semo_18 pair
# (nominally 1800 to 2400; no neighbouring block, pinned by
# test/data_files_test.dart). The product range is narrower: 1900 to 2100,
# SupportedDateRange in astro_core. See docs/decisions/ZOD-FND-011-*.md.
flutter:
  assets:
    - assets/ephe/
