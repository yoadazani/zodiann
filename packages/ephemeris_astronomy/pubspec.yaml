name: ephemeris_astronomy
description: "EphemerisPort implementation over astronomy-engine C (backup and comparison)."
publish_to: none
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  astro_core:
    path: ../astro_core
  # ZOD-EPH-004: the Android build hook (hook/build.dart) compiles the shim and
  # the vendored astronomy-engine source with native assets; ffi marshals the
  # calls; meta marks the test-only hooks.
  code_assets: ^2.0.0
  ffi: ^2.1.4
  hooks: ^2.2.0
  logging: ^1.3.0
  meta: ^1.16.0
  native_toolchain_c: ^0.19.4

dev_dependencies:
  # ZOD-EPH-004: generates lib/src/ffi/astronomy_bindings.g.dart
  # (`dart run tool/ffigen.dart`; needs libclang).
  ffigen: ^23.0.0
  test: ^1.32.0
